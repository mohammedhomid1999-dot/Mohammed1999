services:
  - type: web
    name: ai-dubbing-studio-gemini
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
